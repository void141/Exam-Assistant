<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Exam Assistant</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="overlay-container" id="overlay-container">
    <!-- Header -->
    <div class="header" id="header">
      <div class="status-group">
        <div class="status-dot" id="status-dot"></div>
        <span class="status-text" id="status-text">Ready</span>
        <div class="queue-badge" id="queue-badge" title="Screenshots in queue">0</div>
      </div>
      <div class="mode-badge" id="mode-badge">CLICK-THROUGH</div>
    </div>

    <!-- Answer Area -->
    <div class="answer-area" id="answer-area">
      <div class="welcome-message" id="welcome-message">
        <div class="welcome-icon">⚡</div>
        <p class="welcome-title">Exam Assistant</p>
        <p class="welcome-subtitle">Press <kbd>Ctrl+Shift+M</kbd> for mouse mode</p>
        <div class="hotkeys-list">
          <div class="hotkey-row"><kbd>Ctrl+Shift+S</kbd> <span>Capture screenshot</span></div>
          <div class="hotkey-row"><kbd>Ctrl+Shift+H</kbd> <span>Hide / Show</span></div>
          <div class="hotkey-row"><kbd>Ctrl+Shift+M</kbd> <span>Mouse Mode</span></div>
          <div class="hotkey-row"><kbd>Ctrl+Shift+X</kbd> <span>Quit</span></div>
        </div>
      </div>
      <div class="answer-content" id="answer-content"></div>
    </div>

    <!-- Control Toolbar (visible in interactive/mouse mode) -->
    <div class="toolbar" id="toolbar">
      <button class="toolbar-btn capture-btn" id="btn-capture" title="Capture Screenshot">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/>
          <circle cx="12" cy="13" r="4"/>
        </svg>
      </button>
      <button class="toolbar-btn send-btn" id="btn-send-all" title="Send All to AI">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="22" y1="2" x2="11" y2="13"/>
          <polygon points="22 2 15 22 11 13 2 9 22 2"/>
        </svg>
      </button>
      <button class="toolbar-btn" id="btn-clear" title="Clear Queue">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="3 6 5 6 21 6"/>
          <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>
        </svg>
      </button>
      <div class="separator"></div>
      <button class="toolbar-btn" id="btn-scroll-up" title="Scroll Up">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="18 15 12 9 6 15"/>
        </svg>
      </button>
      <button class="toolbar-btn" id="btn-scroll-down" title="Scroll Down">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="6 9 12 15 18 9"/>
        </svg>
      </button>
      <div class="separator"></div>
      <button class="toolbar-btn" id="btn-hide" title="Hide Overlay">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/>
          <line x1="1" y1="1" x2="23" y2="23"/>
        </svg>
      </button>
      <button class="toolbar-btn" id="btn-clickthrough" title="Switch to Click-through">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 4h7V2H2v9h2z"/>
          <path d="M20 20h-7v2h9v-9h-2z"/>
        </svg>
      </button>
      <button class="toolbar-btn quit-btn" id="btn-quit" title="Quit">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="18" y1="6" x2="6" y2="18"/>
          <line x1="6" y1="6" x2="18" y2="18"/>
        </svg>
      </button>
    </div>

    <!-- Loading indicator -->
    <div class="loading-bar" id="loading-bar">
      <div class="loading-bar-fill"></div>
    </div>
  </div>

  <script src="renderer.js"></script>
</body>
</html>
